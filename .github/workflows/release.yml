name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: |
          set -eu
          mkdir -p build dist
          for os in linux windows darwin freebsd; do
            for arch in amd64 arm64; do
              name="thronectl-${GITHUB_REF_NAME}-${os}-${arch}"
              exe=thronectl
              if [ "$os" = windows ]; then exe=thronectl.exe; fi
              mkdir "build/$name"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "build/$name/$exe" ./cmd/thronectl
              cp LICENSE README.md "build/$name/"
              if [ "$os" = windows ]; then
                (cd build && zip -qr "../dist/$name.zip" "$name")
              else
                tar -C build -czf "dist/$name.tar.gz" "$name"
              fi
            done
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
