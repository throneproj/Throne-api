name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, such as v0.1.0. A tag that does not exist yet is created on the selected branch.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the version
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::\"$TAG\" is not a version such as v0.1.0 or v0.2.0-beta.1"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the existing tag if there is one
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            git checkout -q "refs/tags/$TAG"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: |
          set -eu
          mkdir -p build dist
          for os in linux windows darwin freebsd; do
            for arch in amd64 arm64; do
              name="thronectl-${TAG}-${os}-${arch}"
              exe=thronectl
              if [ "$os" = windows ]; then exe=thronectl.exe; fi
              mkdir "build/$name"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=${TAG}" -o "build/$name/$exe" ./cmd/thronectl
              cp LICENSE README.md "build/$name/"
              if [ "$os" = windows ]; then
                (cd build && zip -qr "../dist/$name.zip" "$name")
              else
                tar -C build -czf "dist/$name.tar.gz" "$name"
              fi
            done
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            flags=()
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --generate-notes "${flags[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
